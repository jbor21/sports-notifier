name: CI

on:
  # Pushes to main, and every pull request. A push to a PR branch would otherwise run CI twice.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same versions as the laptop, so "passes in CI" means "works locally".
  K3D_VERSION: v5.9.0
  HELM_VERSION: v4.3.0

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about 5 minutes. A hang used to hold the runner for up to 6 hours.
    timeout-minutes: 20
    services:
      # The tests expect Redis on localhost:6379.
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # A watchdog: if the tests are still running after 12 minutes (normal is about 5), it saves
      # every JVM's thread dump, prints the test JVM's main thread, and stops Maven, so a hang fails
      # with evidence instead of running until the job timeout. (Seen: HistoryWriterTest hanging
      # while Postgres was paused, 3 of 5 runs on 2026-10-08.)
      - name: Run mvn -B test
        run: |
          mvn -B test &
          mvn_pid=$!
          (
            sleep 720
            echo "::error::tests still running after 12 minutes; saving thread dumps"
            mkdir -p target/kafka-diagnostics
            for p in $(jps -q); do jstack -l "$p" > "target/kafka-diagnostics/threads-$p.txt" 2>&1 || true; done
            for f in target/kafka-diagnostics/threads-*.txt; do
              echo "== $f"; awk '/^"main"/{p=1} p&&/^$/{exit} p' "$f"
            done
            kill "$mvn_pid"
          ) &
          watchdog=$!
          rc=0
          wait "$mvn_pid" || rc=$?
          kill "$watchdog" 2>/dev/null || true
          exit "$rc"
      # A failed Kafka test leaves the broker's log and a docker stats snapshot here (testsupport.KafkaDiagnostics);
      # the watchdog above leaves thread dumps here too.
      - name: Save Kafka diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kafka-diagnostics
          path: target/kafka-diagnostics/
          if-no-files-found: ignore

  # The web app: format, types (generated from docs/api/openapi.yaml), unit tests, production build,
  # and the PWA update test (two builds, a static server, Chromium; no cluster).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from web/package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm types:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pwa
      - name: Save the Playwright trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-test-results
          path: web/test-results/
          if-no-files-found: ignore

  # Phase 5: the Terraform and the AWS scripts, checked without touching AWS: formatting, a validate of each
  # stack (no backend, no credentials), and the scripts' failure paths with fake CLIs.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_wrapper: false
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: terraform fmt and validate
        run: |
          terraform fmt -check -recursive infra
          for stack in infra/base infra/cluster; do
            [ -d "$stack" ] || continue
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
      - run: bash scripts/test-chaos-scripts.sh
      - name: AWS script tests
        run: '[ ! -f scripts/test-aws-scripts.sh ] || bash scripts/test-aws-scripts.sh'
      - name: Chart render tests
        run: '[ ! -f scripts/test-chart.sh ] || bash scripts/test-chart.sh'
      - name: Postgres restore scripts (fake S3, real postgres:17)
        run: bash scripts/test-restore.sh

  # Deploy to a throwaway k3d cluster with the same make targets used on the laptop.
  deploy-check:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: the push to ECR below signs in to AWS with GitHub's OIDC token, not stored keys.
    permissions:
      contents: read
      id-token: write
    # The AWS role and registry are secrets, not variables, so the account id stays out of the public
    # logs. A step's `if` can't read secrets, so the job turns "is it set" into a plain flag.
    env:
      PUSH_TO_ECR: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v7
      # The runner has about 14 GB of free disk; with the observability image (Phase 4.3) the k3d node fell
      # below kubelet's eviction threshold and every pod was evicted. These preinstalled SDKs are never used.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=$K3D_VERSION bash
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      # For make e2e: the web UI in a real browser against the cluster.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the browser for make e2e
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # check: the correctness checker on the ci replay set at 60x (about 4 minutes); its report is in this log.
      # trace-check: that run's traces and metrics reached the observability pod, one trace through every hop.
      - run: make cluster up smoke check trace-check e2e SET=ci SPEED=60
      - name: Show pods and logs
        if: failure()
        run: make logs
      # Screenshots, network, and socket frames of a failed browser run.
      - name: Save Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results/
          if-no-files-found: ignore
      # Phase 5: the image this run just proved (smoke, check, trace-check, e2e) goes to ECR, so EKS can
      # pull it. Skipped until infra/base exists and the repository secrets are set (docs/aws-setup.md),
      # and on pull requests from forks, which get no secrets and no OIDC token.
      - name: Sign in to AWS
        if: success() && env.PUSH_TO_ECR == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      # GitHub masks a secret only as the exact string. The ECR login prints the registry host it gets
      # back from AWS (<account id>.dkr.ecr…), so mask the account id itself before it can appear.
      - name: Mask the AWS account id
        if: success() && env.PUSH_TO_ECR == 'true'
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Sign in to ECR
        if: success() && env.PUSH_TO_ECR == 'true'
        uses: aws-actions/amazon-ecr-login@v2.1.7
      - name: Push the image to ECR
        if: success() && env.PUSH_TO_ECR == 'true'
        env:
          ECR_URL: ${{ secrets.ECR_URL }}
          PR: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A value pasted into GitHub's secret form can carry a trailing newline (seen on PR #58).
          ECR_URL=$(printf '%s' "$ECR_URL" | tr -d '[:space:]')
          # make up tagged the image with the checked-out commit (a PR run checks out GitHub's merge commit).
          local_image="sports-notifier:$(git rev-parse --short HEAD)"
          docker image inspect "$local_image" >/dev/null
          if [ -n "$PR" ]; then
            tags="pr$PR-${PR_HEAD:0:7} pr$PR"   # the head commit is not fetched in a PR checkout
          else
            # Exactly 7 characters, as aws-up asks for: git lengthens --short on a big repo, and the
            # laptop's full clone and CI's shallow one could then disagree.
            tags="$(git rev-parse --short=7 HEAD)"
          fi
          for t in $tags; do
            docker tag "$local_image" "$ECR_URL:$t"
            docker push "$ECR_URL:$t"
            echo "pushed sports-notifier:$t to ECR" >> "$GITHUB_STEP_SUMMARY"
          done
