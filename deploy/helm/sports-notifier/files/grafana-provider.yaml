# Loads this chart's dashboards into Grafana at startup (Phase 4.3 spec, 1.4). Mounted beside the image's
# own providers, which stay.
apiVersion: 1
providers:
  - name: sports-notifier
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options:
      path: /otel-lgtm/sports-notifier
      foldersFromFilesStructure: false
