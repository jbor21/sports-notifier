# Laptop settings (k3d). Phase 5 adds values-aws.yaml; the templates stay the same.

services:
  gateway:
    env:
      # Some browsers (Safari) and tools refuse Secure cookies on plain http://localhost.
      # On AWS, behind HTTPS, the default (true) applies.
      COOKIE_SECURE: "false"

espnPoller:
  enabled: false   # turn on for live ESPN data

javaResources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 512Mi }

# One Kafka node on the laptop, so every topic has one copy.
kafka:
  replicas: 1
  storage: 2Gi
  heap: 512m
  replicationFactor: 1
  minInsyncReplicas: 1

# Postgres keeps its data in a folder on the Mac, mounted into the k3d node by `make cluster`, so it
# survives `make down`. The password is fixed because Postgres reads it only when it first creates
# that folder: a generated one would change with every new cluster and no service could log in.
# Postgres is reachable only inside the cluster, behind a network policy.
postgres:
  hostPath: /var/lib/sportsnotifier/postgres
  password: local-dev-only-password
