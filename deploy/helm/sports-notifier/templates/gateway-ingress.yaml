# The front door: Traefik (bundled with k3d) routes every outside request to the gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    {{- include "sports-notifier.labels" "gateway" | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
