{{- if .Values.espnPoller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: espn-poller
  labels:
    {{- include "sports-notifier.labels" "espn-poller" | nindent 4 }}
spec:
  # One is enough. A normal rolling update briefly runs the old and new poller side by side,
  # which is harmless: event ids and seq come from ESPN's data, so the second poller's events
  # are duplicates or stale, and the Lua script drops them.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: espn-poller
  template:
    metadata:
      labels:
        {{- include "sports-notifier.labels" "espn-poller" | nindent 8 }}
    spec:
      containers:
        - name: espn-poller
          image: {{ include "sports-notifier.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SERVICE
              value: espn-poller
            {{- include "sports-notifier.baseEnv" . | nindent 12 }}
            {{- include "sports-notifier.espnEnv" . | nindent 12 }}
            - name: EPS_URL
              value: http://event-processing:8083
            - name: ESPN_POLL_LIVE_MS
              value: {{ .Values.espnPoller.liveMs | quote }}
            - name: ESPN_POLL_IDLE_MS
              value: {{ .Values.espnPoller.idleMs | quote }}
          resources:
            {{- toYaml .Values.javaResources | nindent 12 }}
{{- end }}
