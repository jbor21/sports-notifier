{{- /*
The app's topics, as Strimzi KafkaTopic resources. Strimzi's topic operator creates each topic in
Kafka and keeps its partitions and settings matching this file, so the topics are versioned with
the code that uses them instead of created by hand. Partition counts can grow, never shrink.
*/}}
{{- $root := . }}
{{- range $name, $t := .Values.kafka.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $name }}
  labels:
    strimzi.io/cluster: {{ $root.Release.Name }}
spec:
  partitions: {{ $t.partitions }}
  replicas: {{ $root.Values.kafka.replicationFactor }}
  config:
    retention.ms: {{ $t.retentionMs | int64 }}
    min.insync.replicas: {{ $root.Values.kafka.minInsyncReplicas }}
{{- end }}
