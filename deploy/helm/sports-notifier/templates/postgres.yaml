apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "sports-notifier.labels" "postgres" | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
{{- /*
The password is read only when Postgres first creates its data folder. Order: the value set in
values (laptop: fixed, because the folder outlives the cluster), else the Secret already in the
cluster (so upgrades keep it), else a new random one.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres" }}
{{- $password := .Values.postgres.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    {{- include "sports-notifier.labels" "postgres" | nindent 4 }}
  annotations:
    # helm uninstall keeps the Secret: the Postgres volume outlives the release, and a reinstall
    # with a newly generated password would lock every service out of the old data. The kept
    # Secret is adopted again by the next install of the same release, and lookup reuses it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  password: {{ $password | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "sports-notifier.labels" "postgres" | nindent 4 }}
spec:
  serviceName: postgres
  # Hard-coded: two Postgres pods would be two unrelated databases, not a replica.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        {{- include "sports-notifier.labels" "postgres" | nindent 8 }}
    spec:
      {{- with .Values.postgres.restore }}
      {{- if .enabled }}
      serviceAccountName: postgres
      securityContext:
        # The volume's root belongs to root; the group lets Postgres write the marker there.
        fsGroup: 999
        # Only when the root doesn't match yet: not a walk over the whole database on every start.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Fetches the last dump into /restore unless the marker says this volume already finished
        # its first boot (files/postgres-restore/fetch-dump.sh).
        - name: fetch-dump
          image: {{ .image }}
          command: ["sh", "/scripts/fetch-dump.sh"]
          env:
            - name: BUCKET
              value: {{ required "postgres.restore.bucket: aws-up passes the dump bucket" .bucket | quote }}
            - name: KEY
              value: {{ .key | quote }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: restore, mountPath: /restore }
            - { name: restore-scripts, mountPath: /scripts }
      {{- end }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- if .Values.postgres.restore.enabled }}
          # Wipes a data folder whose first boot never finished (no restore-done marker), then runs
          # the image's usual entrypoint (files/postgres-restore/start.sh).
          command: ["bash", "/scripts/start.sh"]
          {{- end }}
          env:
            # initdb wants an empty folder it owns; the mount point may hold lost+found or be root-owned.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: sportsnotifier
            - name: POSTGRES_USER
              value: sportsnotifier
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: password }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if .Values.postgres.restore.enabled }}
            - { name: restore, mountPath: /restore, readOnly: true }
            - { name: restore-scripts, mountPath: /scripts }
            - name: restore-scripts
              mountPath: /docker-entrypoint-initdb.d/10-restore.sh
              subPath: 10-restore.sh
            {{- end }}
          # Over TCP: while the image sets up a new database (and restores into it) Postgres listens
          # only on its socket, so a socket check would call a half-restored database Ready.
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "sportsnotifier"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "sportsnotifier"] }
            periodSeconds: 20
            failureThreshold: 6
      {{- if or .Values.postgres.hostPath .Values.postgres.restore.enabled }}
      volumes:
        {{- if .Values.postgres.hostPath }}
        # Laptop: a folder on the Mac (mounted into the k3d node by `make cluster`), so the data
        # survives `make down`.
        - name: data
          hostPath:
            path: {{ .Values.postgres.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.postgres.restore.enabled }}
        # The dump, from the init container to 10-restore.sh. It lives as long as the pod, so a
        # restarted Postgres container finds it again.
        - name: restore
          emptyDir: {}
        - name: restore-scripts
          configMap:
            name: postgres-restore
            # Executable, so the image runs 10-restore.sh as its own process instead of sourcing it.
            defaultMode: 0555
        {{- end }}
      {{- end }}
  {{- if not .Values.postgres.hostPath }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
  {{- end }}
