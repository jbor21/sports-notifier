# The Kafka cluster. These are Strimzi resources, not pods: the Strimzi operator (installed by
# `make cluster`) reads them and creates the broker pods, their disks, and the bootstrap Service.
{{- $k := .Values.kafka }}
# The machines: each node is both a KRaft controller (keeps the cluster's metadata, the job ZooKeeper
# used to do) and a broker (stores partitions, serves clients).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ $k.replicas }}
  roles: [controller, broker]
  # A real disk (k3d's local-path provisioner on the laptop), so a broker restart keeps confirmed plays.
  storage:
    type: persistent-claim
    size: {{ $k.storage }}
    deleteClaim: false
  {{- if $k.zoneSpread }}
  # AWS: one broker per availability zone, never two in one, so losing a zone loses one broker.
  template:
    pod:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/pool-name: dual-role
  {{- end }}
  jvmOptions:
    -Xms: {{ $k.heap }}
    -Xmx: {{ $k.heap }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Release.Name }}
spec:
  kafka:
    version: {{ $k.version }}
    {{- if $k.zoneSpread }}
    # Each broker learns its zone, and Kafka puts a partition's copies in different zones. Spreading
    # the pods alone isn't enough: without this, two of a partition's three copies can share a zone.
    rack:
      topologyKey: topology.kubernetes.io/zone
    {{- end }}
    listeners:
      # The only client port. No TLS or auth inside the cluster yet (Phase 5); instead Strimzi writes
      # a NetworkPolicy from networkPolicyPeers so only these workloads (and Strimzi's own pods,
      # which use other ports) can open a connection. The list is every service with kafka: true in
      # values.yaml, so a new Kafka client can't be left off it, plus the checker Job (make check),
      # which reads game-events and the consumer groups' lag.
      - name: plain
        port: 9092
        type: internal
        tls: false
        networkPolicyPeers:
          - podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    {{- range $name, $svc := .Values.services }}
                    {{- if $svc.kafka }}
                    - {{ $name }}
                    {{- end }}
                    {{- end }}
                    - checker
    config:
      # A misspelled topic name fails instead of quietly creating a new topic.
      auto.create.topics.enable: false
      default.replication.factor: {{ $k.replicationFactor }}
      min.insync.replicas: {{ $k.minInsyncReplicas }}
      # Kafka's own topics (consumer offsets, producer state) cannot have more copies than brokers.
      offsets.topic.replication.factor: {{ $k.replicationFactor }}
      transaction.state.log.replication.factor: {{ $k.replicationFactor }}
      transaction.state.log.min.isr: {{ $k.minInsyncReplicas }}
  entityOperator:
    # Turns our KafkaTopic resources (kafka-topics.yaml) into real topics.
    topicOperator: {}
{{- if .Values.observability.enabled }}
  # Consumer lag as Prometheus metrics (kafka_consumergroup_lag): a small Deployment beside the broker
  # that reads each group's committed offsets and each partition's end. Lag is a property of the
  # group, not of one worker, and a crashed worker reports nothing, so it is scraped from outside
  # (Phase 4.3 spec, 1.2). The chart's kafka-exporter Service is how the collector finds it.
  kafkaExporter:
    groupRegex: "stage1|stage2|history"
    topicRegex: "game-events|notifications"
{{- end }}
