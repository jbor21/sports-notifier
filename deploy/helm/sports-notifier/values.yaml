image:
  repository: sports-notifier
  tag: dev            # make up always overrides with the git-based tag
  pullPolicy: IfNotPresent

javaResources:
  requests: { cpu: 50m, memory: 256Mi }
  limits: { memory: 512Mi }

probes:
  startup:   { periodSeconds: 5,  failureThreshold: 24 }  # up to 2 minutes to boot
  readiness: { periodSeconds: 10, failureThreshold: 3 }
  liveness:  { periodSeconds: 20, failureThreshold: 3 }

# One Deployment per entry, named after the key. clusterService: false means no Service object.
# kafka: true gives the service KAFKA_BOOTSTRAP, the broker's address.
# postgres: true gives it PG_URL, PG_USER and PG_PASSWORD (from the postgres Secret).
services:
  gateway:
    replicas: 1
    port: 8080
    portEnv: GATEWAY_PORT
    clusterService: true
    espn: true          # gets ESPN_HOST / ESPN_USER_AGENT for /api/upcoming
    podNameEnv: GATEWAY_ID   # this gateway's id: its channel is gw:<id>, and conn:<userId> names it
    # Wait 5 s before SIGTERM so Traefik stops routing here first: no 504s during a rollout (#31).
    # Needs Kubernetes 1.34+ (the native sleep action); terminationGracePeriodSeconds stays 30.
    preStopSleepSeconds: 5
    env:
      USER_PREF_URL: http://user-pref:8081
      GAME_STATE_URL: http://game-state:8082
      NOTIFICATION_URL: http://notification:8087
  user-pref:        { replicas: 1, port: 8081, portEnv: USER_PREF_PORT,        clusterService: true, postgres: true }
  game-state:       { replicas: 1, port: 8082, portEnv: GAME_STATE_PORT,       clusterService: true }
  event-processing: { replicas: 1, port: 8083, portEnv: EVENT_PROCESSING_PORT, clusterService: true, kafka: true }
  notification:     { replicas: 1, port: 8087, portEnv: NOTIFICATION_PORT,     clusterService: true, postgres: true }
  # Stage 1: reads game-events, writes one notifications message per user.
  stage1-worker:
    replicas: 1
    port: 8085
    portEnv: STAGE1_WORKER_PORT
    clusterService: false
    kafka: true
  # Stage 2: reads notifications, delivers each exactly once in effect (history + the user's gateways).
  stage2-worker:
    replicas: 1
    port: 8086
    portEnv: STAGE2_WORKER_PORT
    clusterService: false
    kafka: true
  # History writers: a second consumer group on notifications, saving each one to Postgres in batches.
  history:
    replicas: 1
    port: 8088
    portEnv: HISTORY_PORT
    clusterService: false
    kafka: true
    postgres: true

# ESPN request settings, shared by the gateway's upcoming-games proxy and the poller. ESPN's
# filtering changes over time; the daily espn-check workflow says when these stop working.
espn:
  host: site.web.api.espn.com
  userAgent: "sports-notifier/1.0 (+https://github.com/boboborenstein-collab/sports-notifier)"

# Always exactly one pod: two Redis pods would be two unrelated databases.
redis:
  image: redis:7.4
  storage: 1Gi

# Always exactly one pod. On the laptop hostPath (set in values-local.yaml) puts the data in a folder on
# the Mac; elsewhere a volume claim of `storage` is used. An empty password makes the chart generate one
# and keep it across upgrades.
postgres:
  image: postgres:17
  storage: 2Gi
  hostPath: ""
  password: ""

# Kafka, run by the Strimzi operator that `make cluster` installs. The broker is named after the Helm
# release; services reach it at <release>-kafka-bootstrap:9092. These are the laptop's sizes; Phase 5's
# values-aws.yaml sets 3 brokers, replication 3, min.insync.replicas 2.
kafka:
  version: 4.3.1            # same as kafka-clients in pom.xml; on Strimzi 1.2.0's supported list
  replicas: 1               # nodes, each both controller and broker
  storage: 2Gi
  heap: 512m
  replicationFactor: 1
  minInsyncReplicas: 1
  topics:
    game-events:     { partitions: 12, retentionMs: 604800000 }    # 7 days; key = game id
    notifications:   { partitions: 48, retentionMs: 86400000 }     # 1 day; key = user id
    game-events-dlq: { partitions: 1, retentionMs: 2592000000 }    # 30 days; plays Stage 1 gave up on (#15)

# The ESPN poller. Polls a league every liveMs while it has a live game or one starting within
# 10 minutes, otherwise every idleMs.
espnPoller:
  enabled: false
  liveMs: 5000
  idleMs: 60000

simulator:
  intervalMs: 2000
  waves: 3

# Recorded ESPN games (src/main/resources/replay/<set>.jsonl.gz) through the real poller: make replay.
replay:
  set: evening
  speed: 10
  activeDeadlineSeconds: 14400   # for a Job started without one; make replay passes its own (evening at 1x is 3.2 h)

# The correctness checker (tools.Checker): make check runs one Job with these defaults; the make
# command line overrides them (SET, SPEED, USERS, SEED). It holds a socket per synthetic user and
# keeps every socket's log in memory, hence more memory than a service.
checker:
  set: ci
  speed: 10
  users: 500
  seed: 1
  activeDeadlineSeconds: 3600    # for a Job started without one; make check passes its own (#49)
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
